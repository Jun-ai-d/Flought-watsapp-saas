# Coolify: no host port binds — the reverse proxy routes to container ports on the
# internal network. Assign domains in Coolify UI: backend → 4000, frontend → 80.
# Local dev: create docker-compose.override.yml (gitignored) with:
#   services.backend.ports: ["4000:4000"]
#   services.frontend.ports: ["8080:80"]
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "4000"
    environment:
      PORT: "4000"
      NODE_ENV: production
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    mem_limit: 2g
    cpus: "1.5"
    # Single replica recommended: pipeline uses in-memory conversationLocks.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_META_APP_ID: ${VITE_META_APP_ID:-}
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
