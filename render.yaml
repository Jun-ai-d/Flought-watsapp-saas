services:
  - type: web
    name: flought-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.x
      # Add your production environment variables here or in the Render Dashboard
      # - key: SUPABASE_URL
      #   sync: false
